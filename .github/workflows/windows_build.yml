name: windows-build

# ---------------------------------------------------------------------------
# ASP-maintenance modifications. The upstream build itself is untouched; the
# additions are:
#   - workflow_dispatch, to build by hand on any branch
#   - explicit MODULE_REF / CTYPE, so the module branch and build type cannot
#     silently drift (upstream derived the module ref from the core branch,
#     which sent every non-Playerbot branch to test-staging, and never set
#     CTYPE, whose default is Release)
#   - locate / collect / verify / upload steps after Build, plus a PDB artifact
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      module_ref:
        description: 'mod-playerbots ref (empty = master). Set to test-staging only when deliberately testing new features.'
        required: false
        default: ''
        type: string
      build_type:
        description: 'CTYPE passed to acore.sh (RelWithDebInfo | Release | Debug)'
        required: false
        default: 'RelWithDebInfo'
        type: string
      retention_days:
        description: 'Artifact retention in days'
        required: false
        default: '30'
        type: string
  push:
    branches: [ "Playerbot", "test-staging" ]
  pull_request:
    branches: [ "Playerbot", "test-staging" ]

concurrency:
  # One concurrency group per workflow + ref.
  #
  # - PRs use `refs/pull/<PR_NUMBER>/merge`, so new commits cancel older
  #   in-progress runs for the same PR.
  # - A merge does NOT cancel the PR's own runs: this group is keyed on
  #   refs/pull/<N>/merge and the master push on refs/heads/master, so they
  #   never share a group. See the cancel-pr-runs-on-close workflow.
  # - Branch pushes are isolated by ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
      # ASP-maintenance: pin the module ref instead of deriving it from the core
      # branch. This project tracks the stable mod-playerbots master.
      MODULE_REF: ${{ inputs.module_ref != '' && inputs.module_ref || 'master' }}
      # ASP-maintenance: conf/dist/config.sh does CTYPE=${CTYPE:-Release}. Set it
      # explicitly so the build, the output folder and the provenance agree.
      CTYPE: ${{ inputs.build_type != '' && inputs.build_type || 'RelWithDebInfo' }}
      # Output folder under var/build/obj/bin. Equals CTYPE unless a generator
      # ever disagrees; override here if that happens.
      RTYPE: ${{ inputs.build_type != '' && inputs.build_type || 'RelWithDebInfo' }}
    steps:
      - name: Checkout AzerothCore
        id: core
        uses: actions/checkout@v7

      - name: Checkout Playerbot Module
        id: module
        uses: actions/checkout@v7
        with:
          repository: mod-playerbots/mod-playerbots
          ref: ${{ env.MODULE_REF }}
          path: modules/mod-playerbots

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.13
      # Cache the fetched Boost + MySQL client so we don't re-download ~350 MB
      # and re-run the Boost installer on every run. The Test-Path guards in
      # "Configure OS" short-circuit the install work when these are restored.
      - name: Cache Boost & MySQL
        uses: actions/cache@v6
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: winbuild-deps:boost-1.87.0:mysql-8.4.9
      - name: Configure OS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The windows-latest runner image already ships CMake, Visual Studio
          # (with the native desktop workload + MSVC) and OpenSSL, so we only need to
          # provide Boost and the MySQL client libraries. We fetch these directly
          # instead of via chocolatey, whose pinned packages keep breaking on CI
          # (VS detection failures and slproweb removing old OpenSSL installers).

          # --- Boost 1.87.0 (msvc-14.3, 64-bit) prebuilt binaries -> C:\local\boost_1_87_0 (BOOST_ROOT) ---
          # Go through downloads.sourceforge.net, which hands out an https mirror. The
          # master.dl host redirects to a plain-http URL that PowerShell 7.4+ refuses to
          # follow, and an installer we then execute shouldn't travel in the clear anyway.
          # SourceForge sniffs the user agent: anything starting with Mozilla gets the HTML
          # download page instead of the file, so send a non-browser one. Note this is the
          # opposite of what the MySQL archives CDN below wants.
          if (-not (Test-Path 'C:\local\boost_1_87_0\boost'))
          {
              $boostExe = Join-Path $env:RUNNER_TEMP 'boost.exe'
              $boostUrl = 'https://downloads.sourceforge.net/project/boost/boost-binaries/' +
                  '1.87.0/boost_1_87_0-msvc-14.3-64.exe'
              # Mirrors drop connections often enough on a 200 MB file to be worth retrying.
              # OperationTimeoutSeconds is the one that catches a mirror going quiet mid-transfer,
              # which would otherwise hang the job until the 6h runner limit. Don't collapse the
              # two into a whole-transfer budget, slow mirrors can need 15+ minutes.
              $boostRequest = @{
                  Uri                      = $boostUrl
                  OutFile                  = $boostExe
                  UserAgent                = 'azerothcore-ci'
                  ConnectionTimeoutSeconds = 60
                  OperationTimeoutSeconds  = 60
              }
              $boostAttempts = 3
              for ($attempt = 1; $attempt -le $boostAttempts; $attempt++)
              {
                  try
                  {
                      Invoke-WebRequest @boostRequest
                      # A mirror can answer 200 with an error page, which doesn't throw. Size-check
                      # inside the loop so a bad payload retries onto a different mirror instead of
                      # failing the job outright. Each attempt re-rolls the mirror.
                      $boostMB = (Get-Item $boostExe).Length / 1MB
                      if ($boostMB -lt 50) { throw "got $([int]$boostMB) MB, likely an HTML page." }
                      break
                  }
                  catch
                  {
                      Write-Host "Boost download attempt $attempt failed: $($_.Exception.Message)"
                      if ($attempt -eq $boostAttempts) { throw }
                      Start-Sleep -Seconds 15
                  }
              }
              Write-Host ("Downloaded Boost installer: {0:N1} MB" -f $boostMB)
              $boostProc = Start-Process -FilePath $boostExe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' -Wait -PassThru
              if ($boostProc.ExitCode -ne 0) { throw "Boost installer failed with exit code $($boostProc.ExitCode)." }
              # Fail fast if the installer "succeeded" but didn't lay down the expected tree,
              # instead of surfacing a cryptic error later during CMake configuration.
              if (-not (Test-Path 'C:\local\boost_1_87_0\boost\version.hpp')) { throw 'Boost install missing headers at C:\local\boost_1_87_0\boost.' }
              if (-not (Test-Path 'C:\local\boost_1_87_0\lib64-msvc-14.3')) { throw 'Boost install missing prebuilt libs at C:\local\boost_1_87_0\lib64-msvc-14.3.' }
          }

          # --- MySQL 8.4 client headers + libs -> C:\tools\mysql\current (path the build expects) ---
          if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib'))
          {
              # Use the archives CDN directly (keeps every version, unlike dev.mysql.com/get which only
              # serves the current GA). A browser user-agent is required or Oracle returns an HTML error page.
              $mysqlZip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
              Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip' -OutFile $mysqlZip -UserAgent 'Mozilla/5.0'
              $mysqlMB = (Get-Item $mysqlZip).Length / 1MB
              Write-Host ("Downloaded MySQL zip: {0:N1} MB" -f $mysqlMB)
              if ($mysqlMB -lt 50) { throw "MySQL zip download looks wrong ($([int]$mysqlMB) MB)." }
              New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
              Expand-Archive -Path $mysqlZip -DestinationPath 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item -Recurse -Force 'C:\tools\mysql\current' }
              Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'
              # Fail fast if the archive layout changed and the client import library isn't
              # where the build expects it, rather than failing later during CMake/link.
              if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) { throw 'MySQL client import library missing at C:\tools\mysql\current\lib\mysqlclient.lib.' }
          }

          # --- OpenSSL: use the copy already installed on the runner image ---
          $opensslRoot = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
              Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } |
              Select-Object -First 1
          if (-not $opensslRoot)
          {
              throw 'No OpenSSL development install found on the runner image.'
          }
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using OpenSSL at $opensslRoot"
      - name: Build
        shell: bash
        run: |
          export CTOOLS_BUILD=all
          ./acore.sh compiler build

      # ==========================================================================
      # ASP-maintenance block.
      #
      # Paths come from conf/dist/config.sh:
      #   BUILDPATH = var/build/obj     (the CMake build tree)
      #   BINPATH   = env/dist          (the install prefix)
      #
      # The first run produced env/dist but no env/dist/bin, so the install did not
      # complete. Nothing below assumes install worked: the binaries are located by
      # search and the runtime is assembled by hand.
      # ==========================================================================

      - name: Record build parameters
        if: always()
        shell: pwsh
        run: |
          $coreSha = (git rev-parse HEAD)
          $modSha  = (git -C modules/mod-playerbots rev-parse HEAD)
          Add-Content -Path $env:GITHUB_ENV -Value "CORE_SHA=$coreSha" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "MODULE_SHA=$modSha" -Encoding utf8

          $lines = @(
            "generated_utc        = $(Get-Date -AsUTC -Format o)"
            "core_repository      = ${{ github.repository }}"
            "core_branch          = ${{ github.ref_name }}"
            "core_commit          = $coreSha"
            "core_commit_date     = $(git log -1 --format=%cI)"
            "core_subject         = $(git log -1 --format=%s)"
            "module_repository    = mod-playerbots/mod-playerbots"
            "module_ref           = $env:MODULE_REF"
            "module_commit        = $modSha"
            "module_commit_date   = $(git -C modules/mod-playerbots log -1 --format=%cI)"
            "module_subject       = $(git -C modules/mod-playerbots log -1 --format=%s)"
            "build_type           = $env:CTYPE"
            "install_prefix       = env/dist"
            "build_dir            = var/build/obj"
            "runner_os            = ${{ runner.os }}"
            "trigger              = ${{ github.event_name }}"
            "github_run_id        = ${{ github.run_id }}"
            "github_run_number    = ${{ github.run_number }}"
            "github_sha           = ${{ github.sha }}"
          )
          $lines | Out-File -FilePath build-provenance.txt -Encoding utf8
          Get-Content build-provenance.txt

      - name: Show build output layout
        if: always()
        shell: pwsh
        run: |
          $dirs = @(
            'var/build/obj',
            'var/build/obj/bin',
            ('var/build/obj/bin/' + $env:RTYPE),
            ('var/build/obj/' + $env:RTYPE),
            'var/build/obj/bin/RelWithDebInfo',
            'var/build/obj/bin/Release',
            'var/build/obj/bin/Debug',
            'env/dist',
            'env/dist/bin',
            'env/dist/etc',
            'build',
            'build/bin',
            ('build/bin/' + $env:RTYPE)
          )
          foreach ($d in $dirs) {
            Write-Host "==== $d ===="
            if (Test-Path $d) {
              Get-ChildItem $d -Force |
                Select-Object Mode, Length, Name |
                Format-Table -AutoSize |
                Out-String -Width 200 |
                Write-Host
            } else {
              Write-Host "(missing)"
            }
          }

      - name: Locate built server binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expected = @(
            'env/dist/bin/worldserver.exe',
            ('var/build/obj/bin/' + $env:RTYPE + '/worldserver.exe'),
            ('var/build/obj/' + $env:RTYPE + '/worldserver.exe'),
            ('build/bin/' + $env:RTYPE + '/worldserver.exe'),
            'build/worldserver.exe'
          )
          Write-Host '--- expected candidates (informational) ---'
          foreach ($c in $expected) { Write-Host ("{0,-64} {1}" -f $c, (Test-Path $c)) }

          # Ground truth: walk the CMake build tree. var/build/obj holds no VCS
          # data, so a recursive search there is cheap and safe.
          Write-Host ''
          Write-Host '--- recursive search ---'
          $found = @()
          foreach ($root in @('var/build/obj', 'env/dist', 'build')) {
            if (-not (Test-Path $root)) { Write-Host "skip (missing): $root"; continue }
            $hits = Get-ChildItem $root -Recurse -Force -File -ErrorAction SilentlyContinue -Include 'worldserver.exe','authserver.exe'
            foreach ($h in $hits) {
              Write-Host ("FOUND  {0}  ({1:N0} bytes)" -f $h.FullName, $h.Length)
              $found += $h
            }
          }
          if ($found.Count -eq 0) {
            throw 'No worldserver.exe / authserver.exe found under var/build/obj, env/dist or build. The build did not produce a server binary.'
          }

          $ws = $found | Where-Object { $_.Name -eq 'worldserver.exe' } |
                Sort-Object @{E={ if ($_.FullName -match 'env/dist/bin') { 0 } else { 1 } }}, @{E={$_.Length}; Descending=$true} |
                Select-Object -First 1
          $as = $found | Where-Object { $_.Name -eq 'authserver.exe' } |
                Sort-Object @{E={ if ($_.FullName -match 'env/dist/bin') { 0 } else { 1 } }}, @{E={$_.Length}; Descending=$true} |
                Select-Object -First 1
          if (-not $ws) { throw 'authserver.exe was found but worldserver.exe was not.' }
          if (-not $as) { throw 'worldserver.exe was found but authserver.exe was not.' }

          Write-Host ''
          Write-Host ("SELECTED worldserver.exe -> {0}" -f $ws.FullName)
          Write-Host ("SELECTED authserver.exe  -> {0}" -f $as.FullName)

          Add-Content -Path $env:GITHUB_ENV -Value "WS_PATH=$($ws.FullName)" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "AS_PATH=$($as.FullName)" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "WS_DIR=$($ws.DirectoryName)" -Encoding utf8

      - name: Collect runtime tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stage = Join-Path $env:RUNNER_TEMP 'asp-server-runtime'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          $binDir = Join-Path $stage 'bin'
          $etcDir = Join-Path $stage 'etc'
          New-Item -ItemType Directory -Force -Path $binDir, $etcDir | Out-Null

          Copy-Item $env:WS_PATH -Destination $binDir -Force
          Copy-Item $env:AS_PATH -Destination $binDir -Force

          # Every DLL beside the built worldserver. Upstream links MySQL and OpenSSL
          # dynamically on Windows, so these are runtime requirements.
          $dlls = @(Get-ChildItem $env:WS_DIR -Force -File -Filter '*.dll' -ErrorAction SilentlyContinue)
          foreach ($d in $dlls) {
            Copy-Item $d.FullName -Destination $binDir -Force
            Write-Host ("copied dll : {0}" -f $d.Name)
          }
          if ($dlls.Count -eq 0) {
            Write-Host 'WARNING: no DLLs beside worldserver.exe. The server may still need libmysql.dll and the OpenSSL DLLs at runtime.'
          }

          # Config templates from the source tree (install may not have run).
          foreach ($c in @(
              'src/server/apps/worldserver/worldserver.conf.dist',
              'src/server/apps/authserver/authserver.conf.dist',
              'src/tools/dbimport/dbimport.conf.dist')) {
            if (Test-Path $c) {
              Copy-Item $c -Destination $etcDir -Force
              Write-Host ("copied conf: {0}" -f $c)
            } else {
              Write-Host ("WARNING: missing conf template {0}" -f $c)
            }
          }

          Write-Host ''
          Write-Host '--- staged runtime ---'
          Get-ChildItem $stage -Recurse -Force |
            Select-Object @{n='Path';e={$_.FullName.Replace($stage,'')}}, Length |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Host

          Add-Content -Path $env:GITHUB_ENV -Value "STAGE=$stage" -Encoding utf8

      - name: Collect debug symbols
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'asp-server-symbols'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Only the two PDBs the server itself produces, not every PDB in the tree.
          $pdbs = @()
          foreach ($name in @('worldserver.pdb', 'authserver.pdb')) {
            $candidate = Join-Path $env:WS_DIR $name
            if (Test-Path $candidate) {
              $item = Get-Item $candidate
              Copy-Item $candidate -Destination $stage -Force
              $pdbs += $item
              Write-Host ("collected {0} ({1:N0} bytes)" -f $name, $item.Length)
            } else {
              Write-Host ("no {0} next to the binaries" -f $name)
            }
          }

          $total = 0
          if ($pdbs.Count -gt 0) { $total = ($pdbs | Measure-Object -Property Length -Sum).Sum }
          Write-Host ("symbols total: {0:N1} MB" -f ($total / 1MB))

          # GitHub rejects artifacts over 500 MB and a 64-bit server PDB can exceed
          # that alone, so the symbols artifact is skipped rather than failing the run.
          $hasSymbols = ($pdbs.Count -gt 0) -and ($total -lt 450MB)
          if ($pdbs.Count -gt 0 -and -not $hasSymbols) {
            Write-Host ("WARNING: symbols are {0:N1} MB, above the safe artifact limit; skipping." -f ($total / 1MB))
          }
          Add-Content -Path $env:GITHUB_ENV -Value "HAS_SYMBOLS=$($hasSymbols.ToString().ToLower())" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "SYMBOLS_STAGE=$stage" -Encoding utf8

      - name: Verify staged runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = Join-Path $env:STAGE 'bin/worldserver.exe'
          $as = Join-Path $env:STAGE 'bin/authserver.exe'
          $ok = $true
          foreach ($f in @($ws, $as)) {
            $exists = Test-Path $f
            Write-Host ("{0,-20} {1}" -f (Split-Path $f -Leaf), $exists)
            if (-not $exists) { $ok = $false }
          }
          if (-not $ok) { throw 'Staged runtime is missing a server binary.' }

          $wsHash = (Get-FileHash $ws -Algorithm SHA256).Hash
          $asHash = (Get-FileHash $as -Algorithm SHA256).Hash
          $dllCount = @(Get-ChildItem (Join-Path $env:STAGE 'bin') -Filter '*.dll' -File -ErrorAction SilentlyContinue).Count

          Write-Host ''
          Write-Host 'SHA256:'
          Write-Host ("  worldserver.exe  {0}" -f $wsHash)
          Write-Host ("  authserver.exe   {0}" -f $asHash)
          Write-Host ("  dll count        {0}" -f $dllCount)
          Write-Host ''
          Write-Host 'OK: runtime staged.'

          Add-Content -Path $env:GITHUB_ENV -Value "WS_SHA256=$wsHash" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "AS_SHA256=$asHash" -Encoding utf8

      - name: Finalize provenance
        shell: pwsh
        run: |
          $coreShort = $env:CORE_SHA.Substring(0, 7)
          $modShort  = $env:MODULE_SHA.Substring(0, 7)
          $runtimeName = "asp-server-win64-$coreShort-$modShort"
          $symbolsName = "asp-symbols-win64-$coreShort-$modShort"
          $lines = @(
            "runtime_worldserver_path   = bin/worldserver.exe"
            "runtime_authserver_path    = bin/authserver.exe"
            "runtime_worldserver_sha256 = $env:WS_SHA256"
            "runtime_authserver_sha256  = $env:AS_SHA256"
            "symbols_included           = $env:HAS_SYMBOLS"
            "artifact_runtime_name      = $runtimeName"
            "artifact_symbols_name      = $symbolsName"
          )
          $lines | Out-File -FilePath build-provenance.txt -Encoding utf8 -Append
          Copy-Item build-provenance.txt -Destination (Join-Path $env:STAGE 'build-provenance.txt') -Force
          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT_RUNTIME=$runtimeName" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT_SYMBOLS=$symbolsName" -Encoding utf8
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Get-Content build-provenance.txt

      - name: Upload server runtime
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_RUNTIME || format('asp-server-win64-{0}', github.sha) }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 30 }}
          path: ${{ env.STAGE }}

      - name: Upload debug symbols
        if: env.HAS_SYMBOLS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_SYMBOLS || format('asp-symbols-win64-{0}', github.sha) }}
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days || 30 }}
          path: ${{ env.SYMBOLS_STAGE }}
